<div id="caseStageContent" class="readonly">

  <div *ngIf="baselineData && Object.keys(baselineData).length" class="baseline-stage">
    
 <h2>Baseline</h2> 
    <div class="print-page">
      <app-demographic [isPrintMode]="true"></app-demographic>
    </div>

    <div class="print-page">
      <app-chief-complaint [data]="baselineData" [isPrintMode]="true"></app-chief-complaint>
    </div>

    <div class="print-page">
      <app-comorbidities [data]="baselineComorbidities" [isPrintMode]="true"></app-comorbidities>
    </div>
    <div class="print-page">
      <app-history [isPrintMode]="true" [data]="baselineHistory"></app-history>
    </div>
    <div class="print-page"> <app-personal-history [isPrintMode]="true"
        [data]="baselinepersonalHistory"></app-personal-history>
    </div>

    <div class="print-page">
      <app-current-medications [isPrintMode]="true" [data]="baselineCurrentMedication"></app-current-medications>

    </div>
    <div class="print-page">
      <app-sleep [isPrintMode]="true" [data]="baselineSleep"></app-sleep>

    </div>

    <div class="print-page">
      <app-gadget [isPrintMode]="true" [data]="baselinegadge"></app-gadget>

    </div>

    <div class="print-page">
      <app-history-endoscopy [isPrintMode]="true"></app-history-endoscopy>

    </div>
    <div class="print-page">
      <app-assessment [isPrintMode]="true" [data]="baselineAssessment"></app-assessment>

    </div>

    <div class="print-page">
      <app-diagnosis [isPrintMode]="true"></app-diagnosis>

    </div>

    <div class="print-page">
      <app-managament [isPrintMode]="true" [data]="baselinemanagement"></app-managament>

    </div>
  </div>

  <div *ngIf="followUp1Data" class="baseline-stage">
    <h2>Follow Up 1</h2>

    <div class="print-page">
      <app-chief-complaint [data]="followUp1Data" [isPrintMode]="true"></app-chief-complaint>
    </div>
    <div class="print-page">
      <app-comorbidities [data]="followUp1Comorbidities" [isPrintMode]="true"></app-comorbidities>
    </div>
  <div class="print-page">
      <app-assessment [isPrintMode]="true" [data]="followUp1Assessment"></app-assessment>
  </div>

<div class="print-page">

      <app-managament [isPrintMode]="true" [data]="followUp1management"></app-managament>

</div>
    </div>
 
  <div *ngIf="followUp2Data" class="baseline-stage">
    <h2>Follow Up 2</h2>
    <div class="print-page">
      <app-chief-complaint [data]="followUp2Data" [isPrintMode]="true"></app-chief-complaint>

    </div>

    <div class="print-page">
      <app-comorbidities [data]="followUp2Comorbidities" [isPrintMode]="true"></app-comorbidities>

    </div>

    <div class="print-page">
      <app-assessment [isPrintMode]="true" [data]="followUp2Assessment"></app-assessment>

    </div>

    <div class="print-page">
      <app-managament [isPrintMode]="true" [data]="followUp2management"></app-managament>

    </div>
  </div>
</div>
