<div class="stepper">
  <div class="step"
       [ngClass]="getStageClass('baseline')"
       (click)="handleStageClick('baseline')">
    Baseline
  </div>

  <div class="step"
       [ngClass]="getStageClass('fu1')"
       (click)="handleStageClick('fu1')">
    Follow-up 1
  </div>

  <div class="step"
       [ngClass]="getStageClass('fu2')"
       (click)="handleStageClick('fu2')">
    Follow-up 2
  </div>
</div>
